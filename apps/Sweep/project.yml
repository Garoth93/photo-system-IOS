# XcodeGen spec. The .xcodeproj is generated in CI with `xcodegen generate`
# and is never committed.
#
name: Sweep

options:
  bundleIdPrefix: com.garoth93
  deploymentTarget:
    iOS: "26.0"   # iPhone dell'utente: iOS 26+; SDK del runner: iOS 26.5 (Xcode 26.6)
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  SweepCore:
    path: ../../packages/SweepCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing is empty here on purpose:
    # - testflight.yml overrides it on the command line (Automatic, team from
    #   the APPLE_TEAM_ID secret, profiles via the App Store Connect API key);
    # - build-ipa.yml (Sideloadly fallback) builds with CODE_SIGNING_ALLOWED=NO.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  Sweep:
    type: application
    platform: iOS
    # Tells Xcode's automatic signing which capabilities the App ID needs.
    attributes:
      SystemCapabilities:
        com.apple.BackgroundModes:
          enabled: 1
        com.apple.iCloud:
          enabled: 1
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: SweepCore
        product: SweepCore
      - sdk: BackgroundTasks.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garoth93.sweep
        PRODUCT_NAME: Sweep
        GENERATE_INFOPLIST_FILE: NO
        # iCloud Drive backup (shared container). build-ipa.yml signs the
        # Sideloadly build with Sweep.sideload.entitlements (no iCloud).
        CODE_SIGN_ENTITLEMENTS: Sweep.entitlements
    info:
      path: Info.plist   # generated by XcodeGen from the properties below (git-ignored)
      properties:
        CFBundleDisplayName: Sweep
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: it
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Portrait only: App Store validation (error 90474) requires full screen.
        UIRequiresFullScreen: true
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSPhotoLibraryUsageDescription: "Sweep ti mostra le foto della galleria una alla volta, così decidi quali tenere e quali eliminare."
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        # Backups: shared iCloud container of all the apps, visible in Files as
        # iCloud Drive › Backup (each app writes in its own sub-folder).
        NSUbiquitousContainers:
          iCloud.com.garoth93.backup:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Backup
            NSUbiquitousContainerSupportedFolderLevels: Any
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.garoth93.sweep.backup

schemes:
  Sweep:
    build:
      targets:
        Sweep: all
    run:
      config: Debug
    archive:
      config: Release
